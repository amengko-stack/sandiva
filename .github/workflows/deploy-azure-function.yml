# Deploys the reminder-cron Azure Function (the replacement for Vercel Cron's
# weekly reminder job) from azure-functions/reminder-cron.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   AZURE_FUNCTIONAPP_NAME             Name of the Azure Function App resource.
#   AZURE_FUNCTIONAPP_PUBLISH_PROFILE  Contents of its publish profile XML.
#     Get it from: Azure Portal -> the Function App resource -> "Get publish profile"
#     (top toolbar of the Overview blade).
#
# NOTE: triggers on `feature/timesheet-m1` to match the app's current active
# branch — change to `main` if/when this branch is merged.

name: Deploy reminder-cron Azure Function

on:
  push:
    branches:
      - feature/timesheet-m1
    paths:
      - "azure-functions/reminder-cron/**"
      - ".github/workflows/deploy-azure-function.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure-functions/reminder-cron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: azure-functions/reminder-cron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: azure-functions/reminder-cron
          # Flex Consumption has no classic Kudu/SCM site — it uses a
          # different deploy path ("One Deploy") that these two settings
          # switch the action onto. Without them the action 404s trying to
          # reach a Kudu endpoint that doesn't exist on this plan.
          sku: "flexconsumption"
          remote-build: true
